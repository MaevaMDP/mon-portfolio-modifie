    <div class="main-content">

</div>

<div id="imageModal" class="modal">
    <span class="close-modal">&times;</span>
    <img id="imgAgrandie" class="modal-content" alt="Agrandissement image RP">
</div>

<script>
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("imgAgrandie");

    // Dès qu'on clique sur un projet
    document.querySelectorAll(".affiche-item").forEach(bloc => {
        bloc.addEventListener("click", function() {
            modal.style.display = "flex";
            // On copie directement le lien exact de l'image cliquée
            modalImg.src = this.querySelector("img").src; 
        });
    });

    // Fermer avec la croix
    document.querySelector(".close-modal").addEventListener("click", function() {
        modal.style.display = "none";
    });

    // Fermer en cliquant dans le fond noir
    modal.addEventListener("click", function(event) {
        if (event.target === modal) modal.style.display = "none";
    });
</script>

</body>
</html>
